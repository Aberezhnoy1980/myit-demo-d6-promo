<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" aria-labelledby="title desc"><title id="title">Мой световой сценарий: Отдых</title><desc id="desc">Мой световой сценарий: Отдых. Рассвет — рассеянный фон; Пауза — островок отдыха; Ореол — акцент вокруг детали. Концепция вымышленной коллекции, не проект освещения.</desc><rect width="680" height="760" fill="#1b201d"/><text x="56" y="57" fill="#c9cbbd" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">СВЕТ / СБОРКА · ДЕМО-КОЛЛЕКЦИЯ</text><text x="56" y="108" fill="#f4f2e7" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Мой световой сценарий</text><text x="56" y="147" fill="#f5b575" font-family="Arial,sans-serif" font-size="22">Отдых</text><rect x="56" y="175" width="568" height="275" fill="#30362f" stroke="#747a6b"/><g transform="translate(56 175)" stroke="#fff3ce" stroke-width="1"><circle cx="105" cy="117" r="43" fill="#f6c76d"/><circle cx="460" cy="117" r="39" fill="#ef8051"/><circle cx="290" cy="220" r="38" fill="#d3bbec"/><circle cx="290" cy="220" r="26" fill="#f2d7a7"/></g><g font-family="Arial,sans-serif"><text x="56" y="500" fill="#bfc3b4" font-size="13" letter-spacing="2">ВЫБРАННЫЕ МОДУЛИ</text><text x="56" y="540" font-size="20" fill="#eae9df">Рассвет — Рассеянный фон</text><text x="56" y="574" font-size="20" fill="#eae9df">Пауза — Островок отдыха</text><text x="56" y="608" font-size="20" fill="#eae9df">Ореол — Акцент вокруг детали</text><text x="56" y="700" fill="#c9cbbd" font-size="14">Вымышленная коллекция · не проект освещения</text><text x="56" y="725" fill="#c9cbbd" font-size="14">Образ сценария, а не подбор реального товара</text></g></svg>