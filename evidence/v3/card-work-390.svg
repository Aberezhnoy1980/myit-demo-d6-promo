<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" aria-labelledby="title desc"><title id="title">Мой световой сценарий: Работа</title><desc id="desc">Мой световой сценарий: Работа. Фокус — свет для рабочего места; Линия — связь вдоль маршрута. Концепция вымышленной коллекции, не проект освещения.</desc><rect width="680" height="760" fill="#1b201d"/><text x="56" y="57" fill="#c9cbbd" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">СВЕТ / СБОРКА · ДЕМО-КОЛЛЕКЦИЯ</text><text x="56" y="108" fill="#f4f2e7" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Мой световой сценарий</text><text x="56" y="147" fill="#f5b575" font-family="Arial,sans-serif" font-size="22">Работа</text><rect x="56" y="175" width="568" height="275" fill="#30362f" stroke="#747a6b"/><g transform="translate(56 175)" stroke="#fff3ce" stroke-width="1"><rect x="180" y="48" width="38" height="145" rx="19" fill="#f5e2b9"/><rect x="55" y="214" width="160" height="15" rx="7" fill="#f6da80"/></g><g font-family="Arial,sans-serif"><text x="56" y="500" fill="#bfc3b4" font-size="13" letter-spacing="2">ВЫБРАННЫЕ МОДУЛИ</text><text x="56" y="540" font-size="20" fill="#eae9df">Фокус — Свет для рабочего места</text><text x="56" y="574" font-size="20" fill="#eae9df">Линия — Связь вдоль маршрута</text><text x="56" y="700" fill="#c9cbbd" font-size="14">Вымышленная коллекция · не проект освещения</text><text x="56" y="725" fill="#c9cbbd" font-size="14">Образ сценария, а не подбор реального товара</text></g></svg>