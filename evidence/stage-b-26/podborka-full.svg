<text x="70" y="1096" font-size="26" fill="#2a312d">Прихожая · Круглое бра «Точка»</text><text x="1130" y="1096" font-size="26" fill="#2a312d" text-anchor="end">5 900 ₽</text><text x="70" y="1140" font-size="26" fill="#2a312d">Прихожая · Подсветка под шкафы и полки «Линия»</text><text x="1130" y="1140" font-size="26" fill="#2a312d" text-anchor="end">6 300 ₽</text><text x="70" y="1184" font-size="26" fill="#2a312d">Кухня-столовая · Подсветка под шкафы и полки «Линия»</text><text x="1130" y="1184" font-size="26" fill="#2a312d" text-anchor="end">6 300 ₽</text><text x="70" y="1228" font-size="26" fill="#2a312d">Кухня-столовая · Подвес над столом «Дуга»</text><text x="1130" y="1228" font-size="26" fill="#2a312d" text-anchor="end">16 400 ₽</text><text x="70" y="1272" font-size="26" fill="#2a312d">Гостиная · Люстра-купол «Рассвет»</text><text x="1130" y="1272" font-size="26" fill="#2a312d" text-anchor="end">24 900 ₽</text><text x="70" y="1316" font-size="26" fill="#2a312d">Гостиная · Бра-акцент «Ореол»</text><text x="1130" y="1316" font-size="26" fill="#2a312d" text-anchor="end">7 800 ₽</text><text x="70" y="1360" font-size="26" fill="#2a312d">Рабочий угол · Настольная лампа на шарнире «Фокус»</text><text x="1130" y="1360" font-size="26" fill="#2a312d" text-anchor="end">8 900 ₽</text><text x="70" y="1404" font-size="26" fill="#2a312d">Спальня · Прикроватное бра «Складка»</text><text x="1130" y="1404" font-size="26" fill="#2a312d" text-anchor="end">9 600 ₽</text>
